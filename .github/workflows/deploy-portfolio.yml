name: Deploy Portfolio to Rodriqe/Rodriqe (gh-pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev source
        uses: actions/checkout@v4

      - name: Assemble site (only static files)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          touch _site/.nojekyll

      - name: Deploy to Rodriqe/Rodriqe gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: Rodriqe/Rodriqe
          publish_branch: gh-pages
          publish_dir: ./_site
          user_name: "Rodriqe"
          user_email: "rigo.qe@gmail.com"
          commit_message: "Deploy portfolio from portfolio@${{ github.sha }}"
